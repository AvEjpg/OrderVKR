{% extends "base.html" %}
{% block page_title %}Обратная связь{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Оцените качество обслуживания</h5>
                <p>Отсканируйте QR-код камерой телефона, чтобы перейти к форме обратной связи.</p>
                <img src="{{ url_for('qr_feedback') }}" alt="QR Code" class="img-fluid rounded" style="max-width: 250px;">
                <p class="mt-3 text-muted">
                    <small>Ваше мнение поможет нам стать лучше!</small>
                </p>
                <a href="https://forms.gle/QPKGqPtbrSsjGTo76" target="_blank" class="btn btn-outline-primary mt-2">
                    <i class="fas fa-external-link-alt me-1"></i> Открыть форму
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
