{% extends "base.html" %}
{% block page_title %}Создать заказ со своим товаром{% endblock %}
{% block actions %}
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i> Назад в каталог
    </a>
{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-success text-white">
        <i class="fas fa-pen-alt me-2"></i> Укажите товары
    </div>
    <div class="card-body">
        <form method="post" id="customOrderForm">
            <div id="items-container">
                <div class="item-row row mb-3">
                    <div class="col-md-5">
                        <input type="text" name="product_name" class="form-control" placeholder="Название товара" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="price" class="form-control" placeholder="Цена" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="quantity" class="form-control" placeholder="Кол-во" value="1" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger remove-row"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
            <button type="button" id="add-row" class="btn btn-secondary mb-3">
                <i class="fas fa-plus"></i> Добавить ещё товар
            </button>
            <button type="submit" class="btn btn-success w-100">Оформить заказ</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('add-row').addEventListener('click', function() {
        const container = document.getElementById('items-container');
        const newRow = container.children[0].cloneNode(true);
        newRow.querySelectorAll('input').forEach(input => input.value = '');
        container.appendChild(newRow);
    });
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-row')) {
            const row = e.target.closest('.item-row');
            if (row && document.querySelectorAll('.item-row').length > 1) {
                row.remove();
            } else {
                alert('Должен быть хотя бы один товар');
            }
        }
    });
</script>
{% endblock %}
