{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4"><i class="fas fa-shopping-cart"></i> Корзина</h2>
    {% if cart_items %}
        {% for item in cart_items %}
        <div class="cart-item d-flex justify-content-between align-items-center">
            <div class="flex-grow-1">
                <h5 class="mb-1">{{ item.name }}</h5>
                <small class="text-muted">{{ item.price }} ₽ × {{ item.quantity }}</small>
                <div class="mt-1"><strong>{{ item.subtotal }} ₽</strong></div>
            </div>
            <div class="btn-group">
                <form method="POST" action="{{ url_for('update_cart') }}" class="me-2">
                    <input type="hidden" name="product_id" value="{{ item.id }}">
                    <input type="number" name="quantity" value="{{ item.quantity }}" min="1" class="form-control form-control-sm" style="width: 70px;">
                    <button type="submit" class="btn btn-sm btn-outline-secondary mt-1"><i class="fas fa-sync-alt"></i></button>
                </form>
                <form method="POST" action="{{ url_for('remove_from_cart_route', product_id=item.id) }}">
                    <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash-alt"></i></button>
                </form>
            </div>
        </div>
        {% endfor %}
        <div class="mt-4 p-3 bg-white rounded shadow-sm d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Итого: {{ total }} ₽</h4>
            <form method="POST" action="{{ url_for('checkout') }}">
                <button class="btn btn-success btn-lg rounded-pill px-5"><i class="fas fa-check-circle"></i> Оформить заказ</button>
            </form>
        </div>
    {% else %}
        <div class="alert alert-info text-center">Корзина пуста. Перейдите в <a href="{{ url_for('index') }}">каталог</a>.</div>
    {% endif %}
</div>
{% endblock %}
